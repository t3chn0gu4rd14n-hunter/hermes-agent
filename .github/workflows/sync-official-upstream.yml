name: Sync official Hermes upstream

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-hermes-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 't3chn0gu4rd14n-hunter/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the official upstream into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's fork-sync API merges without resetting our commits.
          # A conflict fails this job and leaves main unchanged; no PR is created.
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main \
            --jq '{message, merge_type, base_branch}'
